name: Signing (disabled until signer is configured)

# This workflow is intentionally disabled because the repository does not currently
# have a valid cosign signer configured. Without a valid signer or GitHub OIDC
# trust configuration, a real signature cannot be created.
#
# Required gate rules:
# - smoke.yml must pass first
# - ci.yml must pass second
# - sign.yml may run only after a valid signer exists
# - release must not proceed without a valid signed artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: No signer configured
        run: |
          echo "Signing is disabled because no valid cosign signer is configured for this repository."
          echo "Configure GitHub OIDC signing or a valid COSIGN private key before enabling this workflow."
