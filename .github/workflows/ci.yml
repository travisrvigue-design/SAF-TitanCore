name: CI - Build, Test, Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show runner info
        run: |
          uname -a
          lsb_release -a || true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Show Python & pip
        run: |
          python --version
          which python
          python -m pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip list

      - name: Ensure test resources directory
        run: |
          mkdir -p tests/resources

      - name: Generate synthetic FASTQ
        run: |
          python scripts/generate_fastq.py tests/resources/small.fastq --reads 50 --seed 123

      - name: Run partitioner
        run: |
          python scripts/partitioner.py tests/resources/small.fastq --out tests/resources/units

      - name: List resources for debugging
        run: |
          ls -R tests || true

      - name: Run tests (pytest -> JUnit)
        env:
          PYTHONPATH: .
        run: |
          mkdir -p reports
          pytest -q --junitxml=reports/junit.xml || true

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/

      - name: Upload tests/resources/units
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-units
          path: tests/resources/units || tests/resources

  verify-signatures:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Verify signatures (placeholder)
        run: |
          echo "No signatures to verify in default run. Configure cosign/SIGSTORE for signing in signing workflow."
