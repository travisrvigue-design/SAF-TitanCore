name: CI - Build, Test, Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy scipy

      - name: Ensure test resources directory
        run: |
          mkdir -p tests/resources

      - name: Generate synthetic FASTQ
        run: |
          python scripts/generate_fastq.py tests/resources/small.fastq --reads 50 --seed 123

      - name: Run partitioner
        run: |
          python scripts/partitioner.py tests/resources/small.fastq --out tests/resources/units

      - name: List resources for debugging
        run: |
          ls -R tests/resources || true

      - name: Run tests
        run: pytest -q

  verify-signatures:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Verify signatures (placeholder)
        run: |
          echo "No signatures to verify in default run. Configure cosign/SIGSTORE for signing in signing workflow."
