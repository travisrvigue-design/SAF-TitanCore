name: CI - Build, Test, Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare & smoke test
        run: |
          mkdir -p tests/resources reports
          python scripts/generate_fastq.py tests/resources/small.fastq --reads 50 --seed 123
          python scripts/partitioner.py tests/resources/small.fastq --out tests/resources/units

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q --junitxml=reports/junit.xml

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            reports/
            tests/resources/
          retention-days: 7
