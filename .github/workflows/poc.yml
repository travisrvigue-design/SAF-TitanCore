name: SAF PoC and Stats

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/poc.yml'

concurrency:
  group: poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install + prepare
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          mkdir -p reports tests/resources 01_Benchmark_Package/Results

      - name: Unit tests (non-blocking)
        env:
          PYTHONPATH: .
        run: pytest -q --junitxml=reports/junit.xml || true

      - name: Generate FASTQ
        run: python scripts/generate_fastq.py tests/resources/small.fastq --reads 10000 --seed 42 --length 100

      - name: Baseline harness (30 runs)
        run: python ci/baseline_harness.py tests/resources/small.fastq --out 01_Benchmark_Package/Results --runs 30

      - name: SAF / Lotusv1 harness (30 runs)
        run: python ci/benchmark_harness.py tests/resources/small.fastq --out 01_Benchmark_Package/Results --runs 30 --workers 8 --chunk 200

      - name: STAT validation + Manifest
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          results = Path("01_Benchmark_Package/Results/benchmark_results.csv")
          if not results.exists():
              print("No results CSV — skipping STAT")
              raise SystemExit(0)
          base, cand = [], []
          with open(results) as f:
              for row in csv.DictReader(f):
                  (base if row.get("run_id","").startswith("baseline") else cand).append(row)
          out = Path("01_Benchmark_Package/Results")
          (out / "baseline.csv").write_text("throughput_units_per_sec\n" + "\n".join(r.get("throughput_units_per_sec","") for r in base) + "\n")
          (out / "candidate.csv").write_text("throughput_units_per_sec\n" + "\n".join(r.get("throughput_units_per_sec","") for r in cand) + "\n")
          PY
          if [ -f 01_Benchmark_Package/Results/baseline.csv ]; then
            python tests/validate_stats.py --baseline 01_Benchmark_Package/Results/baseline.csv --candidate 01_Benchmark_Package/Results/candidate.csv || true
          fi
          python -c "
          from pathlib import Path
          try:
              from src.utils.hash_manifest import write_manifest
              write_manifest(Path('.'), Path('01_Benchmark_Package/Results/repo_manifest.txt'))
          except Exception as e:
              print('Manifest skipped:', e)
          "

      - name: Upload PoC artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saf-poc-artifacts
          path: |
            reports/
            01_Benchmark_Package/Results/
          retention-days: 30
