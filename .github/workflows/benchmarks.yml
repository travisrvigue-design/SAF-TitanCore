name: Benchmarks

on:
  workflow_dispatch:

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f ci/benchmark-requirements.txt ]; then
            pip install -r ci/benchmark-requirements.txt
          fi

      - name: Prepare data
        run: |
          mkdir -p tests/resources benchmark-results
          if [ ! -f tests/resources/small.fastq ]; then
            python scripts/generate_fastq.py tests/resources/small.fastq --reads 500 --seed 99
          fi

      - name: Run benchmarks
        run: |
          test -f ci/benchmark_harness.py
          python ci/benchmark_harness.py tests/resources/small.fastq \
            --out benchmark-results --runs 10 --workers 4 --chunk 100

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results/
          retention-days: 14
